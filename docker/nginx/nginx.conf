worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # uvicorn на хосте (dev). Когда появится сервис app — заменить на app:8000.
    upstream api {
        server host.docker.internal:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # /api/v1 + docs. Тела маленькие (presigned upload мимо nginx).
        # proxy_pass БЕЗ URI — иначе nginx срежет /api и uvicorn увидит /v1/...
        location /api/ {
            client_max_body_size 16k;
            proxy_http_version 1.1;
            # $http_host сохраняет порт (:8080); иначе Starlette Location теряет его
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_pass http://api;
        }

        # /health, /metrics; пока нет SPA — catch-all на uvicorn
        location / {
            client_max_body_size 16k;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_pass http://api;
        }

        # X-Accel-Redirect → MinIO (только internal redirect из ответа API)
        location /internal-s3/ {
            internal;
            proxy_pass http://minio:9000/;
            proxy_set_header Authorization "";
            proxy_set_header Host $proxy_host;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-request-id-2;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
