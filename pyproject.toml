[project]
name = "task_manager"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "smoke: full stack via nginx :8080 (compose + uvicorn + ATTACHMENT_DOWNLOAD_MODE=x_accel)",
]
# smoke не в обычном прогоне — явно: pytest -m smoke
addopts = "-m 'not smoke'"

[tool.ty]
src = ["src"]
